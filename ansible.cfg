[defaults]
inventory        = ./inventory.ini
remote_user      = admin
private_key_file = /root/.ssh/mint_kiosk_admin
host_key_checking = True
forks            = 10
retry_files_enabled = False
timeout          = 30

# Speeds up repeated runs against the same fleet
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
